<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><span class="logo">家</span><span>家庭投资助手</span></div>
      <div class="top-right"><span class="demo" id="dataset-badge">完全虚构 · 演示数据</span><span class="asof" id="asof"></span></div>
    </header>
    <section class="hero">
      <div class="panel hero-main">
        <div class="eyebrow">家庭资产健康与挂单检查 · 首版</div>
        <h1>先看资产逻辑，<br class="mobile-only">再看手上怎么挂单</h1>
        <p class="lede">战略复核和周期波段分开显示。系统给出依据与复算，家人自己决定是否调整券商挂单。</p>
      </div>
      <div class="panel hero-side"><div class="side-label">当前需要人工处理的事项</div><div class="side-value" id="action-count">—</div><div class="side-note" id="action-note"></div></div>
    </section>
    <div class="workspace-tools" aria-label="本地数据操作">
      <button class="btn primary" id="new-blank">新建空白数据</button>
      <button class="btn" id="import-trigger">导入 JSON</button>
      <button class="btn" id="export-data">导出当前数据</button>
      <input class="toolbar-hidden" type="file" id="import-file" accept="application/json,.json">
      <span class="tool-note" id="workspace-note">数据仅在当前页面内编辑；刷新前请导出保存。</span>
    </div>
    <div class="inline-note warning" id="foundation-note"></div>
    <nav class="nav" aria-label="主导航">
      <button class="active" data-tab="overview">总览</button>
      <button data-tab="holdings">持仓批次</button>
      <button data-tab="orders">买卖挂单</button>
      <button data-tab="trades">成交记录</button>
      <button data-tab="strategy">投资规则</button>
      <button data-tab="checks">资金与数据</button>
    </nav>
    <div id="view"></div>
    <footer class="footer" id="footer-note"></footer>
  </main>
  <dialog class="restore-dialog" id="restore-dialog" aria-labelledby="restore-title">
    <h2 id="restore-title">确认恢复这份备份？</h2>
    <p id="restore-file-info"></p>
    <div class="compare-grid">
      <section class="compare-card"><h3>当前页面</h3><div id="current-summary"></div></section>
      <section class="compare-card"><h3>待恢复文件</h3><div id="incoming-summary"></div></section>
    </div>
    <p>确认后，文件内容会替换当前页面中的数据。恢复不会修改原备份文件，也不会自动保存页面后续编辑。</p>
    <div class="dialog-actions"><button class="btn" id="cancel-restore" type="button">取消</button><button class="btn primary" id="confirm-restore" type="button">确认恢复并替换</button></div>

    function transactionFollowup(tx,a){
      if(!tx||!a)return {side:null,text:'成交对应的标的未找到，请先核对代码。'};
      if(!['buy','sell'].includes(tx.side))return {side:null,text:'成交方向无效，请先核对买入或卖出记录。'};
      const price=Number(tx.price),quantity=Number(tx.quantity),x=Number(a.x)||0;
      if(!Number.isFinite(price)||price<=0||!Number.isFinite(quantity)||quantity<=0)return {side:null,text:'成交价或数量无效，暂不生成后续参考。'};
      if(tx.side==='buy'&&tx.lane!=='波段仓')return {side:null,text:'战略仓买入不机械套用短期止盈价；后续按估值与21个交易日库存减持规则人工复核。'};
      if(tx.afterSale==='清仓')return {side:null,text:'本次卖出后清仓：先重新评估估值；适中或偏低时，再按滚动7天最高价回撤2x制定建仓参考，不直接按本次卖价回补。'};
      if(!Number.isFinite(x)||x<=0||x>=1)return {side:null,text:'该标的 x 未设置为有效正数比例，请先核对波动参考，再计算后续买卖价。'};
      if(tx.side==='buy'&&tx.lane==='波段仓')return {side:'sell',price:price*(1+x),text:`波段买入后卖出参考：${money(price*(1+x),a.currency)}（成交价上涨 x=${(x*100).toFixed(2)}%）`};
      return {side:'buy',price:price*(1-2*x),text:`卖出后回撤 2x 买回参考：${money(price*(1-2*x),a.currency)}（卖价回撤 ${(2*x*100).toFixed(2)}%）`};
    }
    function transactionSyncPlan(tx,a){
      const fail=error=>({ok:false,error});
      if(!tx||!a)return fail('成交对应的标的未找到，请先核对代码。');
      if(tx.accountApplied)return fail('这笔成交已同步到账户，不能重复应用。');
      const quantity=Number(tx.quantity),price=Number(tx.price),fees=Number(tx.fees||0),currency=a.currency;
      if(!['buy','sell'].includes(tx.side)||!['战略仓','波段仓'].includes(tx.lane)||!Number.isFinite(quantity)||quantity<=0||!Number.isFinite(price)||price<=0||!Number.isFinite(fees)||fees<0)return fail('成交方向、仓位用途、数量、价格或费用无效。');
      if(tx.side==='buy'&&tx.lane==='战略仓'&&!String(tx.purchaseRationale||'').trim())return fail('战略仓买入需要填写买入依据，才能同步到账户。');
      const orders=a.orders||[],holdings=a.holdings||[];
      let matchedOrder=null,matchedOrderIndex=null;
      if(tx.matchedOrderIndex!==undefined&&tx.matchedOrderIndex!==null&&String(tx.matchedOrderIndex)!==''){
        matchedOrderIndex=Number(tx.matchedOrderIndex);
        if(!Number.isInteger(matchedOrderIndex)||matchedOrderIndex<0||matchedOrderIndex>=orders.length)return fail('匹配的本地挂单已不存在，请重新选择。');
        matchedOrder=orders[matchedOrderIndex];
        if(matchedOrder.side!==tx.side||!orderIsActive(matchedOrder))return fail('匹配挂单必须与成交方向一致且仍处于有效状态。');
        if(quantity>Number(matchedOrder.quantity)+1e-9)return fail('本次成交数量超过所选挂单剩余数量。');
      }
      const gross=quantity*price,delta=tx.side==='buy'?-(gross+fees):(gross-fees);
      if(tx.side==='sell'&&delta<0)return fail('卖出费用高于成交金额，无法记入现金。');
      const cash=data.cash.find(c=>c.currency===currency),cashBefore=Number(cash?.balance)||0;
      let cashAfter=cashBefore+delta,holdingBefore=holdings.reduce((s,h)=>s+(Number(h.quantity)||0),0),holdingAfter=holdingBefore+(tx.side==='buy'?quantity:-quantity),lot=null,lotIndex=null;

      if(action==='remove-asset'){
        const asset=data.assets[ai];
        if((data.transactions||[]).some(tx=>canonicalAssetCode(tx.asset_code)===canonicalAssetCode(asset?.code))){alert('该标的已有成交记录，不能直接删除；请先保留记录并核对账户。');return;}
        data.assets.splice(ai,1);
      }
      if(action==='add-lot') data.assets[ai].holdings.push({quantity:0,purchase_date:today(),purchase_price:0,holding_type:'',purchase_rationale_reference:''});
      if(action==='remove-lot'){
        const hi=Number(button.dataset.hi),asset=data.assets[ai];adjustDraftTransactionSelection(asset.code,'sellLotIndex',hi);asset.holdings.splice(hi,1);
      }
      if(action==='add-order'){
        const side=button.dataset.side, a=data.assets[ai];
        a.orders.push({side,quantity:0,limit_price:0,reference_type:'',reference_price:0,strategy_lane:'波段',status:'active'});ensureCash(a.currency);
      }
      if(action==='remove-order'){
        const oi=Number(button.dataset.oi),asset=data.assets[ai];adjustDraftTransactionSelection(asset.code,'matchedOrderIndex',oi);asset.orders.splice(oi,1);
      }
      if(action==='add-transaction'){
        const code=$('#transaction-asset').value,side=$('#transaction-side').value,lane=$('#transaction-lane').value,date=$('#transaction-date').value,quantity=Number($('#transaction-quantity').value),price=Number($('#transaction-price').value),fees=Number($('#transaction-fees').value||0),purchaseRationale=$('#transaction-rationale').value.trim(),afterSale=$('#transaction-after-sale').value;
        const a=data.assets.find(item=>canonicalAssetCode(item.code)===canonicalAssetCode(code));
        if(!a||!['buy','sell'].includes(side)||!['波段仓','战略仓'].includes(lane)||(side==='sell'&&!['仍有持仓','清仓'].includes(afterSale))||!date||!Number.isFinite(quantity)||quantity<=0||!Number.isFinite(price)||price<=0||!Number.isFinite(fees)||fees<0||(side==='buy'&&lane==='战略仓'&&!purchaseRationale)){alert('请核对标的、方向、仓位用途、日期、正数成交数量和价格、非负费用；卖出需选卖出后状态，战略仓买入需填写依据。');return;}
        data.transactions=data.transactions||[];
        data.transactions.unshift({asset_code:a.code,side,lane,date,quantity,price,fees,purchaseRationale,afterSale:side==='sell'?afterSale:'',currency:a.currency});
      }
      if(action==='remove-transaction'){
        const tx=data.transactions[Number(button.dataset.ti)];
        if(tx?.accountApplied){alert('已同步到账户的成交记录不能直接删除；如需更正，请先核对账户后新增反向调整记录。');return;}
        data.transactions.splice(Number(button.dataset.ti),1);
      }
      if(action==='sync-transaction'){
        const ti=Number(button.dataset.ti),tx=data.transactions[ti],a=data.assets.find(item=>canonicalAssetCode(item.code)===canonicalAssetCode(tx?.asset_code)),plan=transactionSyncPlan(tx,a);
        if(!plan.ok){alert(plan.error);return;}
        const matched=plan.matchedOrder?`\n匹配挂单：${plan.matchedOrderIndex+1}号，剩余数量 ${plan.matchedOrder.quantity}，${plan.matchedOrder.status||'仍有效'}`:'\n不匹配既有挂单';
        const batch=tx.side==='sell'?`\n卖出批次：第${plan.lotIndex+1}批 ${tx.lane}`:'';
        const message=`请核对后同步到本地数据：\n${a.name}（${a.code}）${tx.side==='buy'?'买入':'卖出'} ${plan.quantity} 股/份 @ ${money(plan.price,plan.currency)}\n成交额：${money(plan.gross,plan.currency)}；费用：${money(plan.fees,plan.currency)}${batch}\n现金：${money(plan.cashBefore,plan.currency)} → ${money(plan.cashAfter,plan.currency)}\n持仓：${plan.holdingBefore} → ${plan.holdingAfter} 股/份${matched}\n\n此操作只改本地持仓、现金及可选匹配的本地挂单状态，不会向券商提交委托。确认继续？`;
        if(!confirm(message))return;
        applyTransactionToLocalAccount(tx,plan);
      }
      if(action==='draft-followup'){
        const tx=data.transactions[Number(button.dataset.ti)],a=data.assets.find(item=>canonicalAssetCode(item.code)===canonicalAssetCode(tx?.asset_code)),next=transactionFollowup(tx,a);
        if(!next.side){alert(next.text);return;}
        if((a.orders||[]).some(o=>o.side===next.side&&orderIsActive(o))){alert(`该标的已有有效${next.side==='buy'?'买':'卖'}单计划，请先核对并编辑现有计划，避免重复挂单。`);return;}
        a.orders.push({side:next.side,quantity:tx.quantity,limit_price:Number(next.price.toFixed(6)),reference_price:tx.price,reference_type:tx.side==='buy'?'实际买入成交价 + x':'实际卖出成交价 - 2x',strategy_lane:tx.lane,status:'active'});
        activeTab='orders';
      }
      if(action==='add-cash'){
        const currency=$('#new-cash-currency').value.trim().toUpperCase(), balance=Number($('#new-cash-balance').value);
        if(!currency){alert('请填写币种代码。');return;}
        if(data.cash.some(c=>c.currency===currency)){alert('该币种现金已存在，请直接编辑余额。');return;}
        data.cash.push({currency,balance:Number.isFinite(balance)?balance:0,balanceReviewed:false,reserved_for_buy_orders:0,available_after_orders:0});
      }
      if(action==='remove-cash'){
        const ci=Number(button.dataset.ci),cash=data.cash[ci];
        if((data.assets||[]).some(a=>a.currency===cash?.currency)||(data.transactions||[]).some(tx=>tx.currency===cash?.currency)){alert('该币种已被标的或成交记录使用，不能删除现金行。');return;}
        data.cash.splice(ci,1);
      }
      if(action==='use-formula'){
        const a=data.assets[ai],o=a.orders[Number(button.dataset.oi)];o.limit_price=Number(expected(o,a.x).toFixed(6));
      }
      data.asOf=today();hasUnsavedChanges=true;render();
    }
    function blankData(){
      return {asOf:today(),simulationOnly:false,foundationNote:'空白本地数据。战略风险经确认后，清仓该标的全部持仓；交易由家庭成员手动执行。',leverage_balance:0,cash:[],assets:[],alerts:[],transactions:[]};
    }
    function validateImportedData(value){
      if(!value||typeof value!=='object') throw new Error('文件格式不符：JSON 顶层需要是数据对象。');
      if(value&&value.backupFormat==='家庭投资数据备份'&&Number(value.backupVersion)!==1) throw new Error(`暂不支持备份格式版本：${value.backupVersion??'未知'}`);
      const d=value.appData||value.data||value;
      if(!d||!Array.isArray(d.assets)||!Array.isArray(d.cash)) throw new Error('文件格式不符：需要包含 assets 和 cash 数组的 JSON。');
      const codes=new Set();
      d.assets.forEach(a=>{if(!a||typeof a!=='object') throw new Error('标的数据格式不正确。');if(a.code&&codes.has(a.code)) throw new Error(`证券代码重复：${a.code}`);if(a.code) codes.add(a.code);a.holdings=Array.isArray(a.holdings)?a.holdings:[];a.orders=Array.isArray(a.orders)?a.orders:[];});
      const currencies=new Set();
      d.cash.forEach(c=>{if(!c||typeof c!=='object'||!c.currency) throw new Error('现金币种信息缺失。');if(currencies.has(c.currency)) throw new Error(`现金币种重复：${c.currency}`);currencies.add(c.currency);c.balanceReviewed=c.balanceReviewed===true;});
      d.assets.forEach(a=>{if(a.currency&&!currencies.has(a.currency)){d.cash.push({currency:a.currency,balance:0,balanceReviewed:false,reserved_for_buy_orders:0,available_after_orders:0});currencies.add(a.currency);}});
      d.alerts=Array.isArray(d.alerts)?d.alerts:[];d.transactions=Array.isArray(d.transactions)?d.transactions:[];
      d.transactions.forEach(tx=>{
        if(!tx||typeof tx!=='object'||!tx.asset_code||!['buy','sell'].includes(tx.side)||!['波段仓','战略仓'].includes(tx.lane)||!/^\d{4}-\d{2}-\d{2}$/.test(String(tx.date||''))||!Number.isFinite(Number(tx.quantity))||Number(tx.quantity)<=0||!Number.isFinite(Number(tx.price))||Number(tx.price)<=0||(tx.side==='sell'&&!['仍有持仓','清仓'].includes(tx.afterSale)))throw new Error('成交记录格式不正确：请检查标的、方向、用途、日期、正数数量和成交价；卖出记录还需说明是否清仓。');
      });
      d.asOf=d.asOf||today();d.simulationOnly=d.simulationOnly===true;
      return JSON.parse(JSON.stringify(d));
    }
    function dataSummary(d){
      const assets=d.assets||[], holdings=assets.reduce((n,a)=>n+(a.holdings||[]).length,0), quantities=assets.reduce((n,a)=>n+(a.holdings||[]).reduce((s,h)=>s+(Number(h.quantity)||0),0),0);
      const orders=assets.flatMap(a=>a.orders||[]), buys=orders.filter(o=>o.side==='buy'&&orderIsActive(o)).length, sells=orders.filter(o=>o.side==='sell'&&orderIsActive(o)).length;
      const cash=(d.cash||[]).map(c=>`${esc(c.currency)} ${esc(new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(Number(c.balance)||0))}`).join('、')||'未录入';
      const unreviewedCash=(d.cash||[]).filter(c=>c.balanceReviewed!==true).map(c=>c.currency).join('、');
      const transactions=d.transactions||[],applied=transactions.filter(tx=>tx.accountApplied).length;
      return [`标的：${assets.length}项`, `持仓批次：${holdings}批（${new Intl.NumberFormat('zh-CN',{maximumFractionDigits:4}).format(quantities)}股/份）`, `有效挂单：${buys}买 / ${sells}卖`, `成交记录：${transactions.length}笔（已入账 ${applied} 笔）`, `现金：${cash}${unreviewedCash?`（待核对：${esc(unreviewedCash)}）`:''}`, `数据时点：${esc(String(d.asOf||'未记录').slice(0,10))}`, `类型：${d.simulationOnly?'虚构演示数据':'本地手工数据'}`].map(x=>`<div>${x}</div>`).join('');
    }
    let pendingRestore=null;
    function closeRestore(){pendingRestore=null;$('#restore-dialog').close();}
    function previewRestore(file,parsed){
      const incoming=validateImportedData(parsed),isEnvelope=parsed&&parsed.backupFormat==='家庭投资数据备份';
      pendingRestore=incoming;
      $('#restore-file-info').textContent=`文件：${file.name} · ${isEnvelope?`备份版本 v${parsed.backupVersion}，导出于 ${parsed.exportedAt||'未记录'}`:'旧版 JSON 导出文件'}`;
      $('#current-summary').innerHTML=dataSummary(data);$('#incoming-summary').innerHTML=dataSummary(incoming);
      $('#restore-dialog').showModal();
    }
    $('#new-blank').addEventListener('click',()=>{if(confirm('新建空白本地数据会替换当前页面内容。未导出的修改将丢失，是否继续？')){data=blankData();activeTab='holdings';hasUnsavedChanges=true;render();}});
    $('#import-trigger').addEventListener('click',()=>$('#import-file').click());
    $('#import-file').addEventListener('change',async event=>{
      const file=event.target.files[0];if(!file)return;
      try{previewRestore(file,JSON.parse(await file.text()));}
      catch(error){alert(`无法导入：${error.message}`);}
      event.target.value='';
    });
    function exportCurrentData(){
      const exportedAt=new Date().toISOString(),backup={backupFormat:'家庭投资数据备份',backupVersion:1,exportedAt,data:JSON.parse(JSON.stringify(data))};
      const stamp=exportedAt.replace(/[:.]/g,'-'),blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=`家庭投资数据-${stamp}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
      hasUnsavedChanges=false;render();
      $('#workspace-note').textContent='已导出带时间戳和格式版本的备份；之后修改仍需再次导出。';
    }
    $('#export-data').addEventListener('click',exportCurrentData);
    $('#cancel-restore').addEventListener('click',closeRestore);
    $('#restore-dialog').addEventListener('cancel',()=>{pendingRestore=null;});
    $('#confirm-restore').addEventListener('click',()=>{if(!pendingRestore)return;data=pendingRestore;pendingRestore=null;hasUnsavedChanges=false;$('#restore-dialog').close();activeTab='overview';render();$('#workspace-note').textContent='备份已恢复到当前页面；后续修改请再次导出保存。';});
    document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;render();}));
    if(typeof window!=='undefined')window.addEventListener('beforeunload',event=>{if(hasUnsavedChanges){event.preventDefault();event.returnValue='';}});
    render();
  </script>
</body>
</html>
