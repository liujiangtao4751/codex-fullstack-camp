<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="面向产品与数据背景学习者的 7 天 Codex 全栈开发训练营"
    />
    <title>Codex 全栈训练营</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23111318%22/><text x=%2216%22 y=%2221%22 text-anchor=%22middle%22 font-size=%2216%22 fill=%22white%22>C</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="file-protocol-help" hidden>
        <strong>课程网站需要通过本地服务器运行</strong>
        <p>请双击项目目录中的“启动课程.command”，不要直接双击 index.html。</p>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>
      if (window.location.protocol === "file:") {
        document.querySelector(".file-protocol-help").hidden = false;
      }
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
